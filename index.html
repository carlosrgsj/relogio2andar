<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Alef Peretz - Ajustado</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: black; 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            text-align: center; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topo { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 5px 40px; 
            height: 10vh; 
        }

        #titulo { 
            font-size: 30px; 
            font-weight: 600; 
            color: #ccc;
        }

        #relogio { 
            font-family: 'Orbitron'; 
            font-size: 98px; 
            color: #00ff00; 
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        #conteudo { 
            flex: 1; /* Ocupa o espaço central */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            padding: 20px; /* Espaço para a imagem não encostar nas bordas */
        }

        #slide { 
            max-height: 100%; /* Diminuído para dar respiro aos avisos e topo */
            max-width: 100%; 
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(255,255,255,0.1); 
            object-fit: contain; 
            transition: opacity 0.8s ease-in-out;
        }

        #rodape { 
            width: 100%; 
            background: #111; 
            padding: 20px 0; 
            font-size: 25px; 
            white-space: nowrap; 
            overflow: hidden; 
            border-top: 3px solid #00ff00;
            height: 3vh; /* Altura definida para garantir que apareça */
            display: flex;
            align-items: center;
        }

        #avisos { 
            display: inline-block; 
            padding-left: 100%; 
            animation: rolar 35s linear infinite; 
        }

        @keyframes rolar { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-100%); } 
        }
    </style>
</head>
<body>

    <div id="topo">
        <div id="titulo">CICLO 2 | ALEF PERETZ</div>
        <div id="relogio">00:00:00</div>
    </div>

    <div id="conteudo">
        <img id="slide" src="" alt="Carregando Conteúdo...">
    </div>

    <div id="rodape">
        <span id="avisos">Sincronizando avisos e imagens da planilha...</span>
    </div>

    <script>
        let listaImagens = [];
        let indexImg = 0;

        function atualizarRelogio() {
            document.getElementById("relogio").innerText = new Date().toLocaleTimeString('pt-BR');
        }

        async function carregarDados() {
            const urlPlanilha = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQKRoBv5fndIMC1ygiemJ0iTXYMo-mMFMNY6_iIOLXdrSE9StX6oz-r3Bt0mQCbnDix7WXz9ZdyNsp3/pub?gid=588852718&single=true&output=csv";

            try {
                const resposta = await fetch(urlPlanilha + "&cache=" + new Date().getTime());
                const csvTexto = await resposta.text();
                
                const linhas = csvTexto.split(/\r?\n/).slice(1);
                let novosAvisos = [];
                let novasImagens = [];

                linhas.forEach(linha => {
                    if (linha.trim()) {
                        let colunas = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        
                        let aviso = colunas[0] ? colunas[0].replace(/"/g, "").trim() : "";
                        if (aviso) novosAvisos.push(aviso);

                        let imgUrl = colunas[1] ? colunas[1].replace(/"/g, "").trim() : "";
                        if (imgUrl && imgUrl.startsWith("http")) {
                            novasImagens.push(imgUrl);
                        }
                    }
                });

                if (novosAvisos.length > 0) {
                    document.getElementById("avisos").innerText = novosAvisos.join("  •  ");
                }

                if (novasImagens.length > 0) {
                    listaImagens = novasImagens;
                    const imgElemento = document.getElementById("slide");
                    if (!imgElemento.src || imgElemento.src === window.location.href) {
                        trocarImagem();
                    }
                }

            } catch (erro) {
                console.error("Erro ao sincronizar:", erro);
            }
        }

        function trocarImagem() {
            const imgElemento = document.getElementById("slide");
            if (listaImagens.length > 0) {
                imgElemento.style.opacity = 0; 
                setTimeout(() => {
                    imgElemento.src = listaImagens[indexImg];
                    imgElemento.style.opacity = 1; 
                    indexImg = (indexImg + 1) % listaImagens.length;
                }, 800);
            }
        }

        window.onload = () => {
            atualizarRelogio();
            setInterval(atualizarRelogio, 1000);
            carregarDados();
            setInterval(carregarDados, 60000);
            setInterval(trocarImagem, 20000);
        };
    </script>
</body>
</html>
