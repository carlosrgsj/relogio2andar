<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Alef Peretz - Ajustado</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: black; 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            text-align: center; 
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topo { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 5px 40px; 
            height: 10vh; 
        }

        #titulo { 
            font-size: 30px; 
            font-weight: 600; 
            color: #ccc;
        }

        #relogio { 
            font-family: 'Orbitron'; 
            font-size: 98px; 
            color: #00ff00; 
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        #conteudo { 
            flex: 1; /* Ocupa o espaço central */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            padding: 20px; /* Espaço para a imagem não encostar nas bordas */
        }

        #slide { 
            max-height: 100%; /* Diminuído para dar respiro aos avisos e topo */
            max-width: 100%; 
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(255,255,255,0.1); 
            object-fit: contain; 
            transition: opacity 0.8s ease-in-out;
        }

        #rodape { 
            width: 100%; 
            background: #111; 
            padding: 20px 0; 
            font-size: 50px; 
            white-space: nowrap; 
            overflow: hidden; 
            border-top: 3px solid #00ff00;
            height: 3vh; /* Altura definida para garantir que apareça */
            display: flex;
            align-items: center;
        }

        #avisos { 
            display: inline-block; 
            padding-left: 100%; 
            animation: rolar 35s linear infinite; 
        }

        @keyframes rolar { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-100%); } 
        }
    </style>
</head>
<body>

    <div id="topo">
        <div id="titulo">CICLO 2 | ALEF PERETZ</div>
        <div id="relogio">00:00:00</div>
    </div>

    <div id="conteudo">
        <img id="slide" src="" alt="Carregando Conteúdo...">
    </div>

    <div id="rodape">
        <span id="avisos">Sincronizando avisos e imagens da planilha...</span>
    </div>

<script>
const SHEET_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqT5Y2GsuCp7N5_YShMfOtjy7_RN2YKO_EMlWP1F5Y-13HInQ9b-LlwLdX8oOibw/pub?gid=58425361&single=true&output=csv';

const INTERVAL_MS = 10000;

async function fetchMedals() {
  try {

    // Mesmo cache-busting do código que funciona
    const response = await fetch(
      SHEET_URL + '&cache=' + new Date().getTime()
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const csvText = await response.text();

    const rows = csvText
      .split(/\r?\n/)
      .filter(row => row.trim());

    if (rows.length < 2) {
      throw new Error('Planilha sem dados');
    }

    // Pega apenas a primeira linha de dados
    const cols = rows[1].split(
      /,(?=(?:(?:[^"]*"){2})*[^"]*$)/
    );

    const gold = parseInt(
      (cols[0] || '').replace(/"/g, '').trim(),
      10
    ) || 0;

    const silver = parseInt(
      (cols[1] || '').replace(/"/g, '').trim(),
      10
    ) || 0;

    const bronze = parseInt(
      (cols[2] || '').replace(/"/g, '').trim(),
      10
    ) || 0;

    updateCount('gold', gold);
    updateCount('silver', silver);
    updateCount('bronze', bronze);

    document.getElementById('status').textContent =
      'Atualizado às ' +
      new Date().toLocaleTimeString('pt-BR') +
      ' | 🥇 ' + gold +
      ' | 🥈 ' + silver +
      ' | 🥉 ' + bronze;

  } catch (e) {
    console.error(e);

    document.getElementById('status').textContent =
      'Erro: ' + e.message;
  }
}

function updateCount(id, value) {
  const el = document.getElementById(id);
  const current = parseInt(el.textContent, 10) || 0;

  if (current !== value) {
    el.textContent = value;

    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');

    setTimeout(() => {
      el.classList.remove('bump');
    }, 400);
  }
}

fetchMedals();
setInterval(fetchMedals, INTERVAL_MS);
</script>
</body>
</html>
